name: Gentle Steps Android Build

on:
  push:
    paths:
      - "gentle-steps-app/**"
      - "assets/images/24 Gentle Steps to Christmas cover.jpg"
      - "assets/images/Mimi.png"
      - "assets/images/Luli.png"
      - "assets/images/Dilo.png"
      - "assets/images/Alio.png"
      - "assets/images/Nini.png"
      - ".github/workflows/gentle-steps-android.yml"
  pull_request:
    paths:
      - "gentle-steps-app/**"
      - ".github/workflows/gentle-steps-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install native shell dependencies
        working-directory: gentle-steps-app/android-shell
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: gentle-steps-app/android-shell
        run: npm run android:generate

      - name: Build debug APK and unsigned release bundle
        working-directory: gentle-steps-app/android-shell/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew lintDebug assembleDebug bundleRelease --stacktrace

      - name: Record package metadata
        working-directory: gentle-steps-app/android-shell
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/bundle/release/app-release.aab
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-build-sha256.txt
          sha256sum android/app/build/outputs/bundle/release/app-release.aab >> android-build-sha256.txt
          cat android-build-sha256.txt
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f android/app/src/main/res/drawable/splash.xml
          test -f android-branding.json
          cat android-branding.json

      - name: Upload Android build proof
        uses: actions/upload-artifact@v4
        with:
          name: gentle-steps-android-preplay-build
          path: |
            gentle-steps-app/android-shell/android/app/build/outputs/apk/debug/app-debug.apk
            gentle-steps-app/android-shell/android/app/build/outputs/bundle/release/app-release.aab
            gentle-steps-app/android-shell/android-build-sha256.txt
            gentle-steps-app/android-shell/dist/native-build.json
            gentle-steps-app/android-shell/android-branding.json
            gentle-steps-app/android-shell/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            gentle-steps-app/android-shell/android/app/src/main/res/drawable/splash.xml
          if-no-files-found: error
