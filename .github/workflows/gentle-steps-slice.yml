name: Gentle Steps Vertical Slice

on:
  push:
    paths:
      - "gentle-steps-app/**"
      - ".github/workflows/gentle-steps-slice.yml"
  pull_request:
    paths:
      - "gentle-steps-app/**"
      - ".github/workflows/gentle-steps-slice.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Gentle Steps Days 1-3 slice
        run: node gentle-steps-app/tests/validate-slice.mjs

      - name: Render mobile review evidence
        shell: bash
        run: |
          python3 -m http.server 4173 --directory . >/tmp/gentle-steps-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p gentle-steps-review
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,844 \
            --screenshot=gentle-steps-review/home-en-390x844.png \
            "http://127.0.0.1:4173/gentle-steps-app/?lang=en"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=390,1000 \
            --screenshot=gentle-steps-review/day1-pl-390x1000.png \
            "http://127.0.0.1:4173/gentle-steps-app/?lang=pl&day=1"
          test -s gentle-steps-review/home-en-390x844.png
          test -s gentle-steps-review/day1-pl-390x1000.png

      - name: Upload mobile review evidence
        uses: actions/upload-artifact@v4
        with:
          name: gentle-steps-days01-03-mobile-review
          path: gentle-steps-review/*.png
          if-no-files-found: error
