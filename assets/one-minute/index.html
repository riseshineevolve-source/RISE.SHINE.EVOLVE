<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Happy Makers – 1-Minute Challenge Generator (Premium)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root {
  --purple-main: #8A2BE2;
  --purple-alt: #9932CC;
  --pink-main: #ff69b4;
  --pink-deep: #ff1493;
  --gold: #ffd700;
  --dark-bg: #000;
  --text-main: #fffdf9;
  --text-muted: #b9b3d9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--dark-bg);
  color: var(--text-main);
  padding: 32px 16px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}
.hm-sparkles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.hm-sparkle { position: absolute; color: var(--gold); font-size: 9px; opacity: 0; animation: twinkle 5s infinite ease-in-out; }
.hm-sparkle:nth-child(1) { top: 8%; left: 18%; animation-delay: .3s; }
.hm-sparkle:nth-child(2) { top: 20%; right: 12%; animation-delay: 1s; }
.hm-sparkle:nth-child(3) { top: 38%; left: 6%; animation-delay: 1.8s; }
.hm-sparkle:nth-child(4) { top: 55%; right: 10%; animation-delay: 2.4s; }
.hm-sparkle:nth-child(5) { top: 72%; left: 25%; animation-delay: 3.1s; }
@keyframes twinkle {
  0% { opacity: 0; transform: scale(.6); }
  20% { opacity: .95; transform: scale(1); }
  40% { opacity: .7; transform: scale(.9); }
  80% { opacity: .35; transform: scale(.8); }
  100% { opacity: 0; transform: scale(.6); }
}
.hm-wrapper { width: 100%; max-width: 740px; text-align: center; position: relative; z-index: 2; }
.hm-title {
  font-size: 2.35rem;
  font-weight: 900;
  margin-bottom: 14px;
  background: linear-gradient(45deg, #8A2BE2, #9932CC, #ff69b4, #ffb6c1);
  -webkit-background-clip: text;
  color: transparent;
}
.hm-title::after {
  content: "";
  display: block;
  width: 260px;
  height: 3px;
  margin: 10px auto 0;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  box-shadow: 0 0 14px rgba(255,215,0,.9);
  border-radius: 999px;
}
.hm-subtitle {
  font-size: 1.08rem;
  color: var(--gold);
  margin: 0 auto 22px;
  text-shadow: 0 0 10px rgba(255,215,0,.28);
  line-height: 1.55;
  max-width: 620px;
}
.hm-subtitle span{display:block;}
.hm-button {
  border: 0;
  padding: 14px 28px;
  border-radius: 999px;
  font-size: 1.06rem;
  font-weight: 750;
  cursor: pointer;
  background: linear-gradient(135deg, #8A2BE2, #ff69b4);
  color: #fff;
  margin-bottom: 10px;
  transition: transform .15s, box-shadow .15s;
}
.hm-button:hover { transform: translateY(-2px); box-shadow: 0 0 22px rgba(255,105,180,.55); }
.hm-card {
  margin: 18px auto 0;
  width: 100%;
  max-width: 560px;
  background: #000;
  border-radius: 22px;
  padding: 18px 18px 16px;
  border: 3px solid var(--purple-main);
  box-shadow: 0 0 26px rgba(138,43,226,.55);
  position: relative;
  opacity: 0;
  scale: .9;
  transition: opacity .27s ease, scale .27s ease;
}
.hm-card::before {
  content: "";
  position: absolute;
  inset: 6px;
  border-radius: 18px;
  border: 2px solid var(--gold);
  pointer-events: none;
  box-shadow: 0 0 15px rgba(255,215,0,.45);
}
.hm-card.show { opacity: 1; scale: 1; }
.hm-card.hide { opacity: 0; scale: .85; pointer-events: none; }
.hm-card-header { display: flex; justify-content: center; gap: 14px; align-items: center; }
.hm-avatar { width: 92px; height: 92px; border-radius: 999px; display:flex; align-items:center; justify-content:center; background: rgba(255,215,0,.08); border: 1px solid rgba(255,215,0,.35); box-shadow: 0 0 14px rgba(255,215,0,.18);  overflow:hidden; }
.hm-avatar svg { width: 48px; height: 48px; display: block; }
    .hm-avatar-video { width: 100%; height: 100%; object-fit: cover; display:block; }
    .hm-avatar-fallback { width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; }
.hm-card-title { font-size: 1.55rem; font-weight: 900; color: var(--gold); text-align:left; }
.hm-category-line { margin-top: 4px; text-align:left; font-size: .92rem; color: var(--text-muted); }
.hm-category-icon { margin-right: 6px; filter: drop-shadow(0 0 3px rgba(255,215,0,.55)); }
.hm-character { margin-top: 12px; font-size: 1.02rem; color: var(--gold); font-weight: 750; }
.hm-card-instruction { margin-top: 10px; font-size: 1.06rem; line-height: 1.6; color: var(--text-main); }
.hm-comment { margin-top: 12px; color: #f3d98f; font-style: italic; font-size: 1.02rem; }
@media (max-width: 600px){
  body{ padding: 24px 10px; }
  .hm-title{ font-size: 2.05rem; }
  .hm-card-title{ font-size: 1.38rem; }
  .hm-card-instruction{ font-size: 1.01rem; }
  .hm-avatar { width: 76px; height: 76px; }
  .hm-avatar svg { width: 40px; height: 40px; }
}
</style>
</head>
<body>
<div class="hm-sparkles">

  <span class="hm-sparkle">✦</span>
  <span class="hm-sparkle">✧</span>
  <span class="hm-sparkle">✦</span>
</div>
<div class="hm-wrapper">
  <h1 class="hm-title">The Happy Makers 1-Minute Challenge</h1>
  <p class="hm-subtitle">
    <span>One click. One tiny mission.</span>

    <div class="hm-card-header">

        <div id="hm-avatar-fallback" class="hm-avatar-fallback" aria-hidden="true"></div>
      </div>
      <div style="max-width: 440px;">

        <div class="hm-category-line">

    </div>
    <div class="hm-character" id="challenge-character"></div>
    <p class="hm-card-instruction" id="challenge-instruction"></p>

</div>

function getAvatarHTML(character) {
  switch (character) {
    case "Luli":

        <svg viewBox="0 0 50 50">
          <path d="M30 4a20 20 0 1 0 0 42c-8-5-12-13-12-21s4-16 12-21z" fill="#FFD700" stroke="#FFD700" stroke-width="2"/>
        </svg>
      `;
    case "Dilo":
      return `
        <svg viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="19" fill="#8A2BE2" stroke="#FFD700" stroke-width="2"/>
          <polygon points="25,12 32,16 32,24 25,28 18,24 18,16" fill="#4b0099" stroke="#FFD700" stroke-width="1.5"/>
        </svg>
      `;
    case "Alio":
      return `
        <svg viewBox="0 0 50 50">
          <path d="M25 6l6 14 14 1-11 9 4 15-13-8-13 8 4-15-11-9 14-1z" fill="#FFD700" stroke="#FFD700" stroke-width="2"/>
        </svg>
      `;
    case "Nini":
      return `
        <svg viewBox="0 0 50 50">
          <circle cx="25" cy="25" r="18" fill="#FFD700" stroke="#FFD700" stroke-width="2"/>
          <circle cx="19" cy="22" r="2.2" fill="#8A2BE2"/>
          <circle cx="31" cy="22" r="2.2" fill="#8A2BE2"/>
          <path d="M18 31c3 3 11 3 14 0" fill="none" stroke="#8A2BE2" stroke-width="2" stroke-linecap="round"/>
        </svg>
      `;
    case "Mimi":

          <path d="M16 20c2-5 16-5 18 0" fill="none" stroke="#8A2BE2" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M18 32c4 4 10 4 14 0" fill="none" stroke="#8A2BE2" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      `;
    case "Bibi":
      return `
        <svg viewBox="0 0 52 52">
          <path d="M7 39l4-18 8 9 7-17 7 17 8-9 4 18z" fill="#FFD700" stroke="#FFD700" stroke-width="2.2"/>
          <circle cx="19" cy="27" r="2.3" fill="#8A2BE2"/>
          <circle cx="33" cy="27" r="2.3" fill="#8A2BE2"/>

const VIDEO_BASE = "assets/videos/";

const CALM_VIDEO_MAP = {
  Mimi: "Mimi calm.mp4",
  Luli: "Luli calm.mp4",
  Dilo: "Dilo calm.mp4",
  Alio: "Alio calm.mp4",
  Nini: "Nini calm.mp4",
  Bibi: "Bibi calm.mp4"
};

function toSrc(filename){
  // Encode spaces safely for GitHub Pages / browsers
  return VIDEO_BASE + encodeURIComponent(filename).replace(/%2F/g, "/");
}

function setAvatar(character){
  const video = document.getElementById('hm-avatar-video');
  const fallback = document.getElementById('hm-avatar-fallback');

  const file = CALM_VIDEO_MAP[character];
  if (!file) {
    video.removeAttribute('src');
    video.style.display = 'none';
    fallback.style.display = 'flex';
    fallback.innerHTML = getAvatarHTML(character);
    return;
  }

  fallback.style.display = 'none';
  video.style.display = 'block';
  video.src = toSrc(file);

  // If a browser blocks autoplay, it's still fine (muted + playsinline usually works)
  video.load();
  const playPromise = video.play();
  if (playPromise && typeof playPromise.catch === 'function') playPromise.catch(()=>{});

  video.onerror = () => {
    video.style.display = 'none';
    fallback.style.display = 'flex';
    fallback.innerHTML = getAvatarHTML(character);
  };
}

const categoryIcons = ["⭐", "✦", "❖", "✧"]; 
let remaining = [...challenges];

function pickChallenge(){
  if (!remaining.length) remaining = [...challenges];
  const i = Math.floor(Math.random() * remaining.length);
  return remaining.splice(i, 1)[0];
}

function renderChallenge(c){
  setAvatar(c.character);
  document.getElementById('hm-avatar-fallback').innerHTML = getAvatarHTML(c.character);
  document.getElementById('challenge-title').textContent = c.title;
  document.getElementById('challenge-instruction').textContent = c.instruction;
  document.getElementById('challenge-character').innerHTML = `With <strong>${c.character}</strong>`;
  document.getElementById('challenge-comment').textContent = c.comment;
  document.getElementById('challenge-category').textContent = c.category;
  document.getElementById('hm-category-icon').textContent = categoryIcons[Math.floor(Math.random()*categoryIcons.length)];
}

function generateChallenge(){
  const card = document.getElementById('result-card');
  card.classList.remove('show');
  card.classList.add('hide');
  setTimeout(()=>{
    const ch = pickChallenge();
    renderChallenge(ch);
    card.classList.remove('hide');
    void card.offsetWidth;
    card.classList.add('show');
  }, 220);
}

document.getElementById('hm-generate-btn').addEventListener('click', generateChallenge);
</script>
