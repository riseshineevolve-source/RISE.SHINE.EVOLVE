<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search Studio</title>
    <style>
        /* --- STYLING GŁÓWNY --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ekran powitalny (Button Start) */
        #start-screen {
            text-align: center;
        }

        #start-btn {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
        }

        #start-btn:hover {
            transform: scale(1.05);
        }

        /* --- KONTENER GRY (Overlay) --- */
        #word-search-game {
            display: none; /* Domyślnie ukryty */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto; /* Pozwala przewijać na małych ekranach */
        }

        /* --- BUTTON CLOSE THE GIFT --- */
        #close-game-btn {
            background-color: #6a1b9a; /* Fioletowy */
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px; /* Odstęp od gry */
            box-shadow: 0 4px 10px rgba(106, 27, 154, 0.3);
            transition: background 0.3s;
            z-index: 1001;
        }

        #close-game-btn:hover {
            background-color: #4a148c;
        }
