<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Search Studio</title>
    <style>
        /* --- STYLING GŁÓWNY --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ekran powitalny (Button Start) */
        #start-screen {
            text-align: center;
        }

        #start-btn {
            background: #FF6B6B;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
        }

        #start-btn:hover {
            transform: scale(1.05);
        }

        /* --- KONTENER GRY (Overlay) --- */
        #word-search-game {
            display: none; /* Domyślnie ukryty */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto; /* Pozwala przewijać na małych ekranach */
        }

        /* --- BUTTON CLOSE THE GIFT --- */
        #close-game-btn {
            background-color: #6a1b9a; /* Fioletowy */
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 15px; /* Odstęp od gry */
            box-shadow: 0 4px 10px rgba(106, 27, 154, 0.3);
            transition: background 0.3s;
            z-index: 1001;
        }

        #close-game-btn:hover {
            background-color: #4a148c;
        }

        /* Główny Box Gry */
        .word-search-container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center; /* CENTROWANIE W PIONIE (PORTRAIT) */
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        /* --- SIATKA LITER --- */
        #grid-container {
            display: flex;
            flex-direction: column;
            align-items: center; /* Kluczowe dla centrowania */
            gap: 5px;
            margin-bottom: 20px;
            user-select: none;
            /* Zabezpieczenie przed przesuwaniem na boki */
            max-width: 100%; 
        }

        .grid-row {
            display: flex;
            justify-content: center; /* Kluczowe dla centrowania */
            gap: 5px;
        }

        .grid-cell {
            width: 40px;
            height: 40px;
            background: #f0f2f5;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #34495e;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .grid-cell.selected {
            background: #FFD166; /* Żółty przy zaznaczaniu */
            color: white;
            transform: scale(1.1);
        }

        .grid-cell.found {
            background: #06d6a0; /* Zielony po znalezieniu */
            color: white;
            animation: pop 0.3s ease;
        }

        /* --- LISTA SŁÓW --- */
        #words-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            text-align: left;
            width: 100%;
            max-width: 400px;
        }

        .word-item {
            padding: 8px 15px;
            background: #f8f9fa;
            border-radius: 12px;
            font-size: 14px;
            color: #7f8c8d;
            transition: 0.3s;
        }

        .word-item.found {
            background: #06d6a0;
            color: white;
            text-decoration: line-through;
        }

        /* --- MEDIA QUERIES (TELEFON PIONOWO) --- */
        @media (max-width: 600px) {
            .word-search-container {
                width: 95%;
                padding: 15px 10px;
            }

            .grid-cell {
                width: 28px; /* Mniejsze komórki */
                height: 28px;
                font-size: 14px;
            }
            
            #grid-container {
                gap: 3px; /* Mniejsze odstępy */
            }
            
            .grid-row {
                gap: 3px;
            }

            #words-list {
                grid-template-columns: repeat(3, 1fr); /* 3 kolumny na dole */
                font-size: 12px;
            }
            
            .word-item {
                padding: 5px;
                text-align: center;
            }
        }

        /* --- MEDIA QUERIES (TELEFON POZIOMO / LANDSCAPE) --- */
        /* To rozwiązuje problem nr 2: lista obok siatki */
        @media (max-width: 900px) and (orientation: landscape) {
            #word-search-game {
                justify-content: flex-start;
                padding-top: 20px;
            }

            .word-search-container {
                flex-direction: row; /* Układ obok siebie */
                align-items: flex-start;
                justify-content: center;
                gap: 30px;
                max-width: 95%;
                padding: 10px 30px;
            }

            #grid-container {
                margin-bottom: 0; /* Usuwamy dolny margines */
            }
            
            .grid-cell {
                width: 26px; /* Lekko mniejsze żeby się zmieściło na wysokość */
                height: 26px;
                font-size: 12px;
            }

            #words-list {
                display: flex;
                flex-direction: column; /* Lista pionowo po prawej */
                width: auto;
                min-width: 150px;
            }

            .word-item {
                text-align: center;
                margin-bottom: 5px;
            }
            
            h2 {
                display: none; /* Opcjonalnie ukrywamy tytuł w landscape żeby zyskać miejsce */
            }
        }

        /* Animacja sukcesu */
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div id="start-screen">
        <h1>Welcome to the Adventure!</h1>
        <p>Your gift is waiting inside.</p>
        <button id="start-btn" onclick="openGame()">Open Gift 🎁</button>
    </div>

    <div id="word-search-game">
        <button id="close-game-btn" onclick="closeGameWithHistory()">Close the Gift 🎁</button>

        <div class="word-search-container">
            <h2>Word Search Studio</h2>
            
            <div id="grid-container">
                </div>

            <div id="words-list">
                </div>
        </div>
    </div>

    <script>
        // --- KONFIGURACJA GRY ---
        const words = ["BRAVE", "CALM", "HAPPY", "KIND", "STRONG", "PROUD"];
        const gridSize = 10;
        let grid = [];
        let selecting = false;
        let selectedCells = [];

        // Funkcja otwierająca grę
        function openGame() {
            const gameDiv = document.getElementById('word-search-game');
            const startScreen = document.getElementById('start-screen');
            
            gameDiv.style.display = 'flex';
            startScreen.style.display = 'none'; // Ukryj ekran startowy

            // --- LOGIKA BACK BUTTON (Pkt 4) ---
            // Dodajemy stan do historii przeglądarki
            history.pushState({ gameOpen: true }, "", "#game");
            
            initGame();
        }

        // Funkcja zamykająca grę (wywoływana przez przycisk Close)
        function closeGameWithHistory() {
            // Symulujemy wciśnięcie "Wstecz", co uruchomi zdarzenie popstate
            if (history.state && history.state.gameOpen) {
                history.back();
            } else {
                // Fallback jeśli ktoś otworzył bezpośrednio (mało prawdopodobne, ale bezpieczne)
                closeGameUI();
            }
        }

        // Fizyczne zamknięcie UI (wywoływane przez przycisk LUB przycisk wstecz)
        function closeGameUI() {
            const gameDiv = document.getElementById('word-search-game');
            const startScreen = document.getElementById('start-screen');
            
            gameDiv.style.display = 'none';
            startScreen.style.display = 'block';
            
            resetGame(); // Opcjonalnie reset gry po wyjściu
        }

        // --- NASŁUCHIWANIE PRZYCISKU WSTECZ (Pkt 4) ---
        window.addEventListener('popstate', function(event) {
            // Jeśli cofniemy się w historii i gra jest otwarta -> zamknij ją
            const gameDiv = document.getElementById('word-search-game');
            if (gameDiv.style.display === 'flex') {
                closeGameUI();
            }
        });

        // --- SILNIK GRY (Bez zmian w logice, tylko rendering) ---

        function initGame() {
            const gridContainer = document.getElementById('grid-container');
            const wordsList = document.getElementById('words-list');
            
            gridContainer.innerHTML = '';
            wordsList.innerHTML = '';
            grid = Array(gridSize).fill().map(() => Array(gridSize).fill(''));

            // Wstawianie słów
            words.forEach(word => placeWord(word));
            
            // Wypełnianie reszty losowymi literami
            for (let r = 0; r < gridSize; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                
                for (let c = 0; c < gridSize; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    }
                    
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.textContent = grid[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    // Eventy dotykowe i myszki
                    cell.addEventListener('mousedown', startSelection);
                    cell.addEventListener('mouseenter', updateSelection);
                    cell.addEventListener('mouseup', endSelection);
                    
                    // Mobile touch support
                    cell.addEventListener('touchstart', handleTouchStart, {passive: false});
                    cell.addEventListener('touchmove', handleTouchMove, {passive: false});
                    cell.addEventListener('touchend', endSelection);

                    rowDiv.appendChild(cell);
                }
                gridContainer.appendChild(rowDiv);
            }

            // Renderowanie listy słów
            words.forEach(word => {
                const li = document.createElement('div');
                li.className = 'word-item';
                li.textContent = word;
                li.id = 'word-' + word;
                wordsList.appendChild(li);
            });

            // Globalny nasłuch myszki (gdyby użytkownik puścił klawisz poza siatką)
            document.addEventListener('mouseup', () => {
                if (selecting) endSelection();
            });
        }

        function placeWord(word) {
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 100) {
                const direction = Math.floor(Math.random() * 2); // 0: poziomo, 1: pionowo
                const row = Math.floor(Math.random() * gridSize);
                const col = Math.floor(Math.random() * gridSize);

                if (canPlace(word, row, col, direction)) {
                    for (let i = 0; i < word.length; i++) {
                        if (direction === 0) grid[row][col + i] = word[i];
                        else grid[row + i][col] = word[i];
                    }
                    placed = true;
                }
                attempts++;
            }
        }

        function canPlace(word, row, col, direction) {
            if (direction === 0 && col + word.length > gridSize) return false;
            if (direction === 1 && row + word.length > gridSize) return false;

            for (let i = 0; i < word.length; i++) {
                const r = direction === 1 ? row + i : row;
                const c = direction === 0 ? col + i : col;
                if (grid[r][c] !== '' && grid[r][c] !== word[i]) return false;
            }
            return true;
        }

        // --- OBSŁUGA ZAZNACZANIA ---

        function startSelection(e) {
            selecting = true;
            selectedCells = [e.target];
            highlightCells();
        }

        function updateSelection(e) {
            if (!selecting) return;
            const start = selectedCells[0];
            const current = e.target;
            
            // Prosta linia (poziomo lub pionowo)
            if (start.dataset.row === current.dataset.row || start.dataset.col === current.dataset.col) {
                calculatePath(start, current);
            }
        }

        function handleTouchStart(e) {
            e.preventDefault(); // Zapobiega przewijaniu strony
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('grid-cell')) {
                startSelection({target: element});
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('grid-cell')) {
                updateSelection({target: element});
            }
        }

        function calculatePath(start, end) {
            // Czyścimy poprzedni wybór wizualny (poza startowym)
            document.querySelectorAll('.grid-cell.selected').forEach(c => c.classList.remove('selected'));
            
            const r1 = parseInt(start.dataset.row);
            const c1 = parseInt(start.dataset.col);
            const r2 = parseInt(end.dataset.row);
            const c2 = parseInt(end.dataset.col);
            
            selectedCells = [];
            
            // Logika wyznaczania ścieżki
            if (r1 === r2) { // Poziomo
                const minC = Math.min(c1, c2);
                const maxC = Math.max(c1, c2);
                for (let c = minC; c <= maxC; c++) {
                    addCellToSelection(r1, c);
                }
            } else if (c1 === c2) { // Pionowo
                const minR = Math.min(r1, r2);
                const maxR = Math.max(r1, r2);
                for (let r = minR; r <= maxR; r++) {
                    addCellToSelection(r, c1);
                }
            }
            highlightCells();
        }

        function addCellToSelection(r, c) {
            const cell = document.querySelector(`.grid-cell[data-row='${r}'][data-col='${c}']`);
            if(cell) selectedCells.push(cell);
        }

        function highlightCells() {
            selectedCells.forEach(cell => cell.classList.add('selected'));
        }

        function endSelection() {
            selecting = false;
            const word = selectedCells.map(c => c.textContent).join('');
            const reversedWord = selectedCells.map(c => c.textContent).reverse().join('');
            
            if (words.includes(word)) markFound(word);
            else if (words.includes(reversedWord)) markFound(reversedWord);
            
            // Czyść zaznaczenie jeśli nie znaleziono
            setTimeout(() => {
                document.querySelectorAll('.grid-cell.selected').forEach(c => c.classList.remove('selected'));
            }, 200);
        }

        function markFound(word) {
            const wordEl = document.getElementById('word-' + word);
            if (wordEl && !wordEl.classList.contains('found')) {
                wordEl.classList.add('found');
                selectedCells.forEach(cell => {
                    cell.classList.add('found');
                    cell.classList.remove('selected');
                });
                checkWin();
            }
        }

        function checkWin() {
            const foundCount = document.querySelectorAll('.word-item.found').length;
            if (foundCount === words.length) {
                setTimeout(() => alert("CONGRATULATIONS! You are a Word Search Legend! 🏆"), 500);
            }
        }
        
        function resetGame() {
           // Opcjonalnie wyczyść planszę przy wyjściu
           document.getElementById('grid-container').innerHTML = '';
        }

    </script>
</body>
</html>
