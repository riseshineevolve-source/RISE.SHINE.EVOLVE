book:
  title: "HAPPY MAKERS DETECTIVE ACADEMY"
  subtitle: "THE MYSTERY OF ROOM ZERO"
  strapline: "30 OFFLINE MYSTERY MISSIONS FOR CURIOUS KIDS AGES 8-12"
  opening_code: "ONE DETECTIVE IS STILL MISSING."
  rule_zero: "ZERO ASSUMPTIONS. NOTICE FIRST. THEORIZE SECOND."
  edition: "Canonical Book 1 Source"
  language: "EN"

characters:
  bibi:
    name: "GRANDMA BIBI"
    tag: "ARCHIVE NOTE"
    asset: "assets/production/bibi.png"
  luli:
    name: "LULI"
    tag: "CLUE CHECK"
    asset: "assets/production/luli.png"
  dilo:
    name: "DILO"
