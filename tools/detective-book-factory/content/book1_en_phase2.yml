    title: "ONE WITNESS IS ACCIDENTALLY IMPOSSIBLE"
    status: "QUICK MISSION"
    guides: ["nini", "luli", "dilo"]
    hook: >-
      Four young actors describe a backstage mix-up. Nobody is trying to trick you, but one
      memory cannot fit the little map and the clock at the same time.
    objective: "Find the statement that cannot be true without calling anyone a liar."
    dialogue:
      - {speaker: "dilo", text: "Aha. A liar."}
      - {speaker: "nini", text: "Or a person with a memory."}
      - {speaker: "luli", text: "Wild concept."}
    consistency:
      map:
        edges:
          - ["DRESSING", "HALL"]
          - ["HALL", "STAGE"]
          - ["HALL", "PROP"]
        walking_minutes_per_edge: 2
      timeline:
        - {time: "16:10", event: "rehearsal bell"}
        - {time: "16:14", event: "prop-room photo"}
      statements:
        - {speaker: "MAYA", text: "At 16:10 I was in Dressing. I stayed there.", possible: true}
        - {speaker: "LEO", text: "At 16:12 I crossed the Hall toward Stage.", possible: true}
        - {speaker: "SOFIA", text: "I was in Prop for the 16:14 photo.", possible: true}
        - {speaker: "NOAH", text: "The 16:10 bell rang while I was on Stage, and I was already in Dressing at 16:12.", possible: false}
      answer: "NOAH"
      reason: "Stage -> Hall -> Dressing takes 4 minutes, so Noah cannot make that trip in 2 minutes."
    meta_reveal: "Noah remembers the destination as 'Room 0'. The current building has no room with that number."
    hints:
      - "Treat the statements as timing claims, not honesty tests."
      - "Each map edge takes 2 minutes. Count the edges between the two places in each claim."
      - "Stage to Dressing needs two edges, or 4 minutes. Noah gives himself only 2."
    nudge: "Count travel time on the map before judging the witness."
    solution_steps:
      - "Dressing and Stage are not directly connected; Hall sits between them."
      - "Each edge takes 2 minutes."
      - "Stage -> Hall -> Dressing therefore takes 4 minutes."
      - "NOAH claims the same move happened between 16:10 and 16:12."
      - "His memory is the impossible one. It can be mistaken without being dishonest."

