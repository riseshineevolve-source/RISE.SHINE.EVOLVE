      start: "LOBBY"
      goal: "PROP ROOM"
      options:
        - id: "A"
          path: ["LOBBY", "PAINT CORRIDOR", "SIDE HALL", "PROP ROOM"]
          fails: "The Paint Corridor is closed until 16:30."
        - id: "B"
          path: ["LOBBY", "STAFF STAIRS", "PROP ROOM"]
          fails: "The staff door is locked and the drawn shortcut cuts through a wall."
        - id: "C"
          path: ["LOBBY", "COSTUME STORAGE", "SIDE HALL", "PROP ROOM"]
          fails: null
      answer: "C"
