    title: "RULE ZERO"
    guides: ["bibi", "mimi", "luli"]
    hook: "Before the final map, Bibi remembers what the Academy meant by zero."
    objective: "Sort facts from theories and unsupported assumptions."
    answer: "ZERO ASSUMPTIONS. NOTICE FIRST. THEORIZE SECOND."
    dialogue:
      - {speaker: "mimi", text: "So Alio's tunnel theory is back?"}
      - {speaker: "luli", text: "Unfortunately, yes."}
      - {speaker: "alio", text: "Helmet vindicated."}

  - number: 29
    rank: "GRAND MASTER"
    type: "boss-spatial"
    title: "THE MAP BENEATH THE MAP"
    guides: ["luli", "dilo", "alio"]
    hook: "The old Academy plan hides a service level. Solve the largest spatial case to locate the access hatch below the sealed room."
    objective: "Use the solved positions to identify the final access coordinate."
    dialogue:
      - {speaker: "dilo", text: "Boss level."}
      - {speaker: "luli", text: "No button-mashing."}
      - {speaker: "alio", text: "Can I at least wear two helmets?"}
    shigai:
      source_page: 47
      solution_page: 78
      grid: "9x9"
      note: "Final publication version must be re-themed and revalidated after room/object replacement."
    verdict_label: "FINAL ACCESS COORDINATE"

  - number: 30
    rank: "GRAND FINAL"
    type: "multi-stage-finale"
    title: "THE MYSTERY OF ROOM ZERO"
    guides: ["bibi", "mimi", "luli", "dilo", "alio", "nini"]
    hook: "The hatch opens into a room the modern Academy forgot. Six badge hooks wait on the wall. Five are occupied."
    objective: "Open the final lock and discover who the missing detective has been from page one."
    final_lock:
      - "Symbol from Dilo's code mission"
      - "Coordinate from Case 29"
      - "Missing word from Rule Zero"
      - "Reader's name from the opening badge"
    reveal: >-
      Room Zero was never room number zero. It was the original Academy training room, named for Rule Zero: begin every case with zero assumptions. Grandma Bibi and her childhood squad built an initiation trail here decades ago, but renovations sealed the room before the trail was completed. The opening training case accidentally reactivated the old mechanical clue system. Nobody has been secretly controlling the adventure. The Academy itself has been replaying the unfinished test.
    reader_payoff: >-
      Inside Room Zero are six badge hooks. Five hold old Academy badges. The sixth is empty and labelled NEXT DETECTIVE. The missing detective was the reader from page one.
    series_hook: >-
      After the case is closed, Dilo opens a drawer Luli explicitly told him not to open. Inside is one thin file stamped CASE 001 - STILL OPEN.
    dialogue:
      - {speaker: "nini", text: "So... who was the missing detective?"}
      - {speaker: "dilo", text: "There is a drawer."}
      - {speaker: "luli", text: "Do not open the drawer."}
      - {speaker: "dilo", text: "Counterpoint: drawer."}

