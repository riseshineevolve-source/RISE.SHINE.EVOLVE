production_notes:
  - "No full-black interior pages. Use dark panels and light page fields for print safety."
  - "Shigai exports are logic references, not final publication art. Re-theme rooms and props only if geometry is preserved and the case is revalidated."
  - "Case 26 must force the reader to physically revisit earlier solved cases."
  - "Case 30 introduces no new puzzle rule. The payoff must come only from information already earned."
  - "The reader, not the Happy Makers, makes the final deduction."
