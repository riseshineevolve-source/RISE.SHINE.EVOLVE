cases:
  1:
    signal_log:
      code: INTAKE-01
      label: BADGE REVERSE
      status: FIRST RECORD LOGGED
      speaker: mimi
      reaction: You found the intake witness. I logged your verdict; the desk has released the next file.
      reader_move: Add INTAKE-01 to the Case Wall on your Field Detective ID.
    hook: 'The black envelope from the opening is now on the Academy’s evidence mat, with the unassigned badge beside
      it. Its receipt says INTERNAL BADGE STOCK and EXTERNAL DELIVERY: NONE. Four visiting helpers—Ari, Bea, Cole
      and Dani—were recorded when it emerged. Use that snapshot to find who was at Delivery.'
    objective: IDENTIFY who was at Delivery when the black envelope emerged.
    dialogue:
    - speaker: mimi
      text: Sealed envelope. No delivery van.
    - speaker: alio
      text: Tiny underground delivery van?
    - speaker: luli
      text: Let us begin with the people we can place.
    - speaker: mimi
      text: Imaginary vehicles can wait.
    chat_is_evidence: false
    guides:
    - mimi
    - luli
    - alio
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    intake_receipt:
      heading: INTAKE-01 // ORIGINAL RECEIPT
      lines:
      - 'SOURCE: INTERNAL BADGE STOCK'
      - 'OUTPUT: ONE SEALED BLACK ENVELOPE'
      - 'ITEM: UNASSIGNED FIELD BADGE 06'
      - 'EXTERNAL DELIVERY: NONE'
      continuity: Same envelope, badge, event and snapshot as the opening; receipt facts are given, not extra deductions.
    meta_reveal: The badge from the black envelope carries the small engraved 0 seen in the invitation. Mimi logs
      Case 01 after the reader verdict. The dormant case queue starts.
  2:
    signal_log:
      code: INTAKE-02
      label: TROPHY EVIDENCE TAG
      status: SECOND MARK
      speaker: alio
      reaction: The trophy has a shelf problem. Its tag has a familiar mark.
      reader_move: Keep the completed map. Add TROPHY TAG to your Case Wall.
    hook: A reopened sports-showcase file records a trophy leaving its shelf. Max was the trophy keeper. Rebuild
      the recorded positions to identify the one person who shared Max’s room; that contact is the next useful person
      to ask about the trophy.
    objective: FIND Max’s only room companion and record their coordinate.
    dialogue:
    - speaker: alio
      text: 'Trophy rescue kit: rope, torch, emergency biscuit.'
    - speaker: luli
      text: What is the biscuit for?
    - speaker: alio
      text: Morale. The rope is negotiable.
    chat_is_evidence: false
    guides:
    - luli
    - alio
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: A plain 0 is stamped on the Academy evidence tag attached to the trophy record.
  3:
    signal_log:
      code: INTAKE-03
      label: RECORD 0471
      status: MATCH ON THE REVERSE
      speaker: nini
      reaction: The front changes the evidence trail. The back gives us a match.
      reader_move: Keep the three meaningful changes and log TAG 0471.
    hook: The trophy file includes two Academy evidence snapshots. Compare the parcel, its tag and the muddy print.
      The printed relevance rule explains which kinds of change matter. Background decoration must not create an
      extra answer.
    objective: CIRCLE the three meaningful changes under the printed relevance rule.
    dialogue:
    - speaker: nini
      text: I have named the important-looking sparkle Inspector Glitter.
    - speaker: luli
      text: Inspector Glitter needs a connection to the case.
    - speaker: nini
      text: Fair. Nobody gets promoted just for shining.
    chat_is_evidence: false
    guides:
    - luli
    - nini
    verdict_fields:
    - THREE MEANINGFUL DIFFERENCES
    meta_reveal: The reverse of Academy evidence-tag copy 0471 carries a printed 0 matching the badge mark in shape.
  4:
    signal_log:
      code: INTAKE-04
      label: CUPCAKE INTAKE LABEL
      status: FOURTH SIGNAL
      speaker: mimi
      reaction: Box enquiry filed. Its intake sticker can join our collection of questions.
      reader_move: Log CUPCAKE LABEL after recording the map.
    hook: The maker-fair kitchen mixed up a test-batch cupcake box and an ordinary collection. Pixel kept the collection
      list. The saved floor record identifies the only person in Pixel’s room when the mix-up was logged.
    objective: LOCATE Pixel’s one room contact. Give name and square.
    dialogue:
    - speaker: dilo
      text: I can test every cupcake.
    - speaker: mimi
      text: The collection list will tell us more.
    - speaker: dilo
      text: Could we compare methods?
    - speaker: mimi
      text: You may hold the list.
    chat_is_evidence: false
    guides:
    - mimi
    - dilo
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: The Academy cupcake-box record has a quality label with a plain 0 inside it.
  5:
    signal_log:
      code: INTAKE-05
      label: LOCKER ENVELOPE
      status: FIVE REAL SIGNALS
      speaker: dilo
      reaction: The code worked. The envelope is old. Two different kinds of interesting.
      reader_move: Keep the solved sequence. Add LOCKER ENVELOPE as the fifth signal.
    hook: Dilo has linked the field evidence locker to the intake desk. Its active four-symbol sequence is saved
      automatically in the session record. An old sealed file is inside, and the keypad gives four clues to its
      order.
    objective: DECODE the one four-symbol order fitting every clue.
    dialogue:
    - speaker: dilo
      text: I challenge you to beat my locker.
    - speaker: luli
      text: Does it know this is a competition?
    - speaker: dilo
      text: It has been briefed.
    - speaker: luli
      text: Then we shall read its clues politely.
    chat_is_evidence: false
    guides:
    - dilo
    - luli
    verdict_fields:
    - SYMBOL 1
    - SYMBOL 2
    - SYMBOL 3
    - SYMBOL 4
    meta_reveal: Inside the opened locker is an old envelope sealed with 0. The linked-session receipt confirms
      that the active symbol sequence was saved.
  6:
    signal_log:
      code: QUEUE-06
      label: MUSEUM LABEL COPY
      status: ARCHIVE ECHO
      speaker: nini
      reaction: An older file has joined our question. At least the spoon has its name back.
      reader_move: Mark the matching shape; leave its meaning open.
    hook: 'The museum asks the Academy to reopen a label mix-up: a Roman spoon was described as a CEREMONIAL DRAGON
      TOOTH. Uma checked the display labels. Find the one person sharing Uma’s recorded room before the team asks
      the next question.'
    objective: FIND the witness sharing Uma’s room. Record their square.
    dialogue:
    - speaker: nini
      text: I was rather looking forward to meeting a dragon.
    - speaker: luli
      text: Would a correctly labelled spoon be acceptable?
    - speaker: nini
      text: A small disappointment. Excellent for soup.
    chat_is_evidence: false
    guides:
    - luli
    - nini
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: The Academy copy of the switched museum label has a plain 0 on its reverse.
  7:
    signal_log:
      code: QUEUE-07
      label: COSTUME PAPER RECORD
      status: NEW CONTEXT
      speaker: mimi
      reaction: The moon did not write its own paperwork. Keep the inventory copy.
      reader_move: Keep the paper record with the completed map.
    hook: A film-club record shows the giant moon costume missing before rehearsal. Gray handled the inventory.
      The backstage snapshot identifies the only person sharing Gray’s area. Alio has put on the spare demonstration
      costume while the team studies the file.
    objective: REBUILD the positions. Name Gray’s one companion and their square.
    dialogue:
    - speaker: mimi
      text: Has anyone seen Alio?
    - speaker: alio
      text: I am the unusually talkative moon.
    - speaker: nini
      text: That explains the helmet sticking out.
    - speaker: mimi
      text: Please bring the moon back to the case table.
    chat_is_evidence: false
    guides:
    - alio
    - mimi
    - nini
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: A plain 0 appears on the Academy paper inventory record. The costume has not gained a new stitch.
  8:
    signal_log:
      code: CHECK-08
      label: ROUTE CHECK
      status: A USEFUL REJECTION
      speaker: alio
      reaction: I have retired one shortcut. The wall seemed relieved.
      reader_move: Keep the legal route and the rule that proved it.
    hook: The team needs the prop room at 16:20. Alio has drawn three routes. Wet paint, a locked staff door and
      a wall block some options. They must arrive now; waiting for a closure to end is not allowed.
    objective: CHOOSE the only permitted route to the prop room.
    dialogue:
    - speaker: alio
      text: My route is beautifully straight.
    - speaker: mimi
      text: Buildings sometimes interrupt a straight line.
    - speaker: alio
      text: I shall discuss that with the building.
    - speaker: mimi
      text: After you read its door signs.
    chat_is_evidence: false
    guides:
    - alio
    - mimi
    verdict_fields:
    - ROUTE
    meta_reveal: The route verdict follows access rules, not speed. This file adds no new Academy mark.
  9:
    signal_log:
      code: ARCHIVE-09
      label: BIBI’S ARCHIVE MEMORY
      status: PATTERN CONFIRMED
      speaker: bibi
      reaction: I used forms with that mark. What its zero meant is the part I need to check.
      reader_move: 'Write FACT: BIBI RECOGNIZES THE OLD FORM.'
    hook: Several case records carry a plain 0. A poster circle and stage-light dial also look round. Decide which
      samples really match. Bibi remembers the Academy form, but a memory is not a complete explanation.
    objective: MATCH the true Academy marks and exclude the lookalikes.
    dialogue:
    - speaker: bibi
      text: I know that mark.
    - speaker: dilo
      text: A complete explanation!
    - speaker: bibi
      text: That was the complete sentence. The explanation needs work.
    - speaker: luli
      text: We can work with an honest gap.
    chat_is_evidence: false
    guides:
    - bibi
    - luli
    - dilo
    verdict_fields:
    - MATCHING MARKS / REASON
    meta_reveal: The plain marks match; the striped circle and dial do not. Bibi recognizes an old Academy intake
      form.
  10:
    signal_log:
      code: QUEUE-10
      label: ROVER DIAGNOSTIC
      status: RECORD SAVED
      speaker: dilo
      reaction: Cable opinions postponed. Our detective has given us a contact to check.
      reader_move: Keep all final witness positions and the diagnostic record.
    hook: Two science-fair teams claimed the same silver rover. Dash kept the prototype access record. The saved
      positions identify who shared Dash’s area, giving the team a contact to question before deciding anything
      about ownership.
    objective: IDENTIFY the contact sharing Dash’s prototype area and their square.
    dialogue:
    - speaker: dilo
      text: Look at that cable tangle. The rover needs me.
    - speaker: luli
      text: So does the access question.
    - speaker: dilo
      text: Case first. Dramatic cable rescue second.
    chat_is_evidence: false
    guides:
    - dilo
    - luli
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: A plain 0 appears on the Academy diagnostic record filed with the rover enquiry.
  11:
    signal_log:
      code: ARCHIVE-11
      label: 08:07 PHOTO
      status: WRONG CASE, USEFUL DETAIL
      speaker: nini
      reaction: That photo cannot be a fair-time record. It can help our other question.
      reader_move: Keep the 08:07 photograph as archive context.
    hook: Mimi empties the evidence bag from the science fair. Three case items, two pens, an oat bar and her missing
      phone land on the table. Compare only the timestamped records A–D against the printed 15:20–16:05 case window.
    objective: FIND which timestamped record A–D falls outside 15:20–16:05.
    dialogue:
    - speaker: nini
      text: Your phone has been living beside the oat bar.
    - speaker: mimi
      text: It was undercover.
    - speaker: nini
      text: Does the oat bar know?
    - speaker: mimi
      text: We protect our sources.
    chat_is_evidence: false
    guides:
    - mimi
    - nini
    verdict_fields:
    - RECORD
    - TIME / REASON
    meta_reveal: The earlier phone photograph shows an old Academy seal in its background. It is historical context,
      not a new stamp on the phone.
  12:
    signal_log:
      code: QUEUE-12
      label: PARROT CUE-CARD COPY
      status: PAPER TRAIL
      speaker: dilo
      reaction: The witness has answered further questions with cracker. We still have the record.
      reader_move: Log the cue-card copy after saving the positions.
    hook: A theatre parrot repeated a four-word phrase nobody remembered teaching it. Winter was the handler named
      in the rehearsal record. The positions show who shared Winter’s area; the parrot’s snack requests are not
      extra clues.
    objective: MATCH Winter to the one other person in the room. Give their coordinate.
    dialogue:
    - speaker: dilo
      text: Please speak clearly for the notebook.
    - speaker: nini
      text: Try listening before your next question.
    - speaker: dilo
      text: The witness said cracker.
    - speaker: nini
      text: A clear request. We are making progress.
    - speaker: dilo
      text: My neatest interview so far.
    chat_is_evidence: false
    guides:
    - nini
    - dilo
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: The Academy copy of the parrot cue card has a small black 0 on its reverse.
  13:
    signal_log:
      code: QUEUE-13
      label: CAMERA MAINTENANCE CARD
      status: OUR DETECTIVE’S RECORD
      speaker: luli
      reaction: 'Your notes give us something better than a theory: a trail we can check.'
      reader_move: Keep the map and maintenance record together.
    hook: An animal-centre camera recorded a blurry image at 4:17 and was later found behind supplies. Remy kept
      its maintenance record. The saved positions identify Remy’s one room companion. The fox is not on the witness
      list.
    objective: FIND the contact sharing Remy’s room and their square.
    dialogue:
    - speaker: alio
      text: My fox theory has one weakness.
    - speaker: luli
      text: Pockets?
    - speaker: alio
      text: Several weaknesses. I am making a list.
    - speaker: luli
      text: Good. Leave room for what the map actually shows.
    chat_is_evidence: false
    guides:
    - luli
    - alio
    record_positions: 'WHEN YOU SOLVE IT:

      WRITE EACH WITNESS NUMBER IN THEIR FINAL SQUARE.'
    verdict_fields:
    - WITNESS NUMBER / NAME
    - COORDINATE
    meta_reveal: The camera’s Academy maintenance record carries the same plain 0.
  14:
    signal_log:
      code: CHECK-14
      label: WITNESS TIMING RECORD
      status: MEMORY TESTED
      speaker: nini
      reaction: We corrected the journey without turning a muddled memory into a crime.
      reader_move: Keep proved travel time separate from theories about Room Zero.
    hook: Four actors remember a backstage mix-up. The route map and clock let you check their accounts. One stated
      journey takes longer than the witness allows. A mistaken memory does not make somebody dishonest.
    objective: IDENTIFY the statement whose journey cannot fit its times.
    dialogue:
    - speaker: dilo
      text: One statement has broken the clock.
    - speaker: nini
      text: Or one person has mixed up two moments.
    - speaker: luli
      text: Test the journey. We are checking a memory, not awarding villain badges.
    chat_is_evidence: false
    guides:
    - nini
    - luli
    - dilo
    verdict_fields:
    - WITNESS
    - TRAVEL-TIME REASON
