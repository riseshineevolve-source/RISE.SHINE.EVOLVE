version: 4
status: CANONICAL_V4_OWNER_REVIEW
purpose: Merge story patches over the durable phase sources. Preserve all logic payloads and answer values.
book:
  edition: ''
  opening_code: 'FIVE FIELD DETECTIVES.

    ONE EMPTY BADGE HOOK.

    THE SIGNAL NEEDS DETECTIVE SIX.'
  rule_zero_teaser: RULE ZERO // SEALED UNTIL THE EVIDENCE EARNS IT
  pdf_subject: Thirty fair-play cases, one Academy mystery and a place for Detective Six.
  pdf_keywords: detective puzzles, logic puzzles, screen-free, kids activity book, Room Zero
  opening_lines:
  - FIVE FIELD DETECTIVES.
  - ONE EMPTY BADGE HOOK.
  - THE SIGNAL NEEDS DETECTIVE SIX.
opening:
  squad_intro: Five field detectives work together at the Happy Makers Detective Academy. They help people untangle
    mix-ups, test suspicious stories and return missing things. Grandma Bibi is their archive mentor. She knows
    the old Academy; she also knows who cannot be left alone with an interesting button.
  academy_intro:
    headline: WELCOME TO THE ACADEMY
    body: 'A maker room, a case wall, a very busy intake desk. People bring questions here. The Happy Makers turn
      them into files: what happened, what can be checked, and what still needs proving. They disagree cheerfully.
      They keep the evidence.'
    chat:
    - speaker: mimi
      text: Everything has a place.
    - speaker: nini
      text: Your phone is in the snack basket.
    - speaker: mimi
      text: That was its temporary place.
  acceptance_letter:
    headline: TO THE PERSON HOLDING THIS BOOK
    body: 'Five field detectives have checked in. One badge hook is still empty.


      The Academy needs another pair of eyes. Thirty files are waiting: genuine new calls and real incidents from
      the archive. Some details may return. Keep what you discover.


      You are invited to train for the empty place: DETECTIVE SIX. Bibi will guide the archive work. The five field
      detectives will work beside you. The verdicts are yours.'
    note: 'Complete the one FIELD DETECTIVE ID.

      Write your call sign.

      Open Case 01.

      Notice what repeats.'
    status: ONE FIELD DETECTIVE REQUIRED
    letter_lines:
    - FIVE FIELD DETECTIVES.
    - SIX BADGE HOOKS.
    - ONE PLACE TO EARN.
  id_card:
    heading: FIELD DETECTIVE ID
    designation: DETECTIVE SIX // RECRUIT
    name_label: DETECTIVE NAME / CALL SIGN
    acceptance: I will follow the evidence, record what I find and ask for a nudge when I need one.
    case_wall_label: CASE WALL // DETAILS TO KEEP
    footer: This is your one official recruit card. Keep the same call sign through the final file.
  how_to_play:
  - READ THE MISSION BRIEF. Find out what happened.
  - CHECK YOUR OBJECTIVE. Know what your verdict must identify.
  - READ INVESTIGATION RULES before starting.
  - STUDY THE EVIDENCE. Pictures and words can hold clues.
  - MARK WHAT YOU KNOW. Tick each clue after using it.
  - KEEP FINAL POSITIONS. Write every witness number in their final square.
  - WRITE YOUR VERDICT and its supporting evidence.
  - STUCK? Use only your case’s next Hint Vault level.
  - CHECK THE SOLUTION after trying. It explains why.
  - KEEP YOUR BOOK. An old case may become useful again.
  hint_instructions:
  - Go to HINT VAULT // LEVEL 1.
  - Find YOUR case number. Read ONLY that hint.
  - Return to your case and try the next step.
  - Still stuck? Find the SAME case in LEVEL 2.
  - LEVEL 3 is the strongest nudge. Choose it only when needed.
  - SOLUTION FILES are at the back. Check after trying; read the reasoning as well as the answer.
  hint_heading: STUCK? ONE NUDGE AT A TIME.
  solution_heading: CHECK THE REASON, NOT JUST THE ANSWER.
  sequence:
  - id: meet
    heading: MEET THE HAPPY MAKERS
    body: Mimi, Luli, Dilo, Alio and Nini are the Academy’s five field detectives. Bibi is their archive mentor.
      Different jobs. Different ideas. One very well-used case table.
    visual: approved squad portrait and six large individual cards
  - id: academy
    heading: FIVE DETECTIVES. SIX HOOKS.
    body: Beside the intake desk stands the portable field-certification rack. Five badges hang under MIMI, LULI,
      DILO, ALIO and NINI. Hook 06 is empty. Bibi’s card reads ARCHIVE MENTOR; she does not use a field slot.
    visual: one rack; five named badges; empty06; separate Bibi mentor card
  - id: wake
    heading: THE EMPTY PLACE WAKES THE INTAKE DESK
    body: 'At closing time, Mimi saves the day’s roster. The old display flickers: FIVE FIELD DETECTIVES CHECKED
      IN. FIELD SLOT 06 UNASSIGNED. Inside the desk, a latch clicks.'
    chat:
    - speaker: dilo
      text: That button has excellent timing.
    - speaker: luli
      text: Mimi pressed Save. Please let the button stay modest.
    visual: roster display, five checked in and06unassigned
  - id: envelope
    heading: ONE BLACK ENVELOPE
    body: 'A sealed black envelope slides from the internal tray. Its receipt reads INTERNAL BADGE STOCK. EXTERNAL
      DELIVERY: NONE. Through its window is an unassigned badge. On the front: TO THE PERSON HOLDING THIS BOOK.'
    visual: black envelope INTAKE01; badge06; readable receipt
  - id: letter
    heading: THE LETTER IS FOR YOU
    body: Mimi opens the flap at the tear strip and unfolds the letter. The blank badge stays on the white evidence
      mat beside it. The invitation is yours to accept.
    visual: opened flap; unfolded letter containing acceptance_letter text
  - id: accept
    heading: CHOOSE YOUR CALL SIGN
    body: If you accept, complete the Field Detective ID on the next page. You become the recruit for slot 06. Official
      field certification comes after the investigation.
    chat:
    - speaker: nini
      text: There is room for your pencil beside mine.
    - speaker: alio
      text: I have a spare helmet.
    - speaker: mimi
      text: Start with the pencil.
    visual: pointer to singleID page; no second name-writing invitation form
  - id: first_case
    heading: START WHERE THE ENVELOPE ARRIVED
    body: Before the desk sends another file, the team must log who was at Delivery when the black envelope emerged.
      Four visiting helpers were recorded on the floor plan. This is Case 01.
    visual: same tray and badge; no second arrival
  character_cards:
  - speaker: mimi
    name: MIMI
    role: FIELD DETECTIVE // CASE CAPTAIN
    lines:
    - Runs the case table.
    - Finds the tiny clue.
    - May need help finding her own phone.
    strength: Turns a muddle into the next useful step.
    funny_habit: Organizes everything except what she just put down.
  - speaker: luli
    name: LULI
    role: FIELD DETECTIVE // CLUE ANALYST
    lines:
    - Reads the small print.
    - Questions the big claim.
    - Short replies. Long books.
    strength: Spots contradictions and tests what evidence proves.
    funny_habit: Can forget a book is not a substitute for lunch.
  - speaker: dilo
    name: DILO
    role: FIELD DETECTIVE // CODE & TECH
    lines:
    - Loves codes, games and close scores.
    - Invents impressive-sounding facts.
    - Will help you test them.
    strength: Connects numbers, machines and clever experiments.
    funny_habit: His confidence can finish before the test does.
  - speaker: alio
    name: ALIO
    role: FIELD DETECTIVE // ROUTES & RECON
    lines:
    - Asks the extra question.
    - Checks the unexpected corner.
    - Packed a helmet for this introduction.
    strength: Notices routes and useful physical details.
    funny_habit: Prepares for imaginary dangers before reading ordinary signs.
  - speaker: nini
    name: NINI
    role: FIELD DETECTIVE // PEOPLE & COURAGE
    lines:
    - Gives nervous people room to speak.
    - Gives serious objects cute names.
    - Asks small, surprisingly good questions.
    strength: Notices feelings and details everyone skipped.
    funny_habit: Can become fond of a theory before it earns its place.
  - speaker: bibi
    name: GRANDMA BIBI
    role: ARCHIVE MENTOR // OLD ACADEMY GUIDE
    lines:
    - Knows old shelves and stranger stories.
    - Says when a memory is incomplete.
    - Stops nonsense without putting down her tea.
    strength: Connects historical records and knows what to verify.
    funny_habit: Remembers the adventure; the date may need a label.
