# HMDA Map Factory visual-rebuild pilot.
#
# Geometry (grid, rooms, objects, placements, answer identity) is imported
# mechanically from the native Shigai checkpoint by
# scripts/build_spatial_map_pilot_manifest.py -- never hand-typed and never
# guessed. `constraints` are hand-authored from each character's verified
# `raw_clue` text and are proven against the checkpoint's own placement by
# scripts/validate_spatial_map_pilot.py before this manifest is trusted.
#
# These two cases are raw candidate geometry pulled from
# HMDA_checkpoint_11.shigai.json for the visual-system pilot only. Per
# content/shigai_module_map.yml and content/book1_en_phase3.yml, neither
# case is currently mapped to a retained Book 1 case -- they are inputs to
# the rendering system, not a claim about final book content.

